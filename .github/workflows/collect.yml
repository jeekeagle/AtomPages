name: 自动汇集

on:
  # 每三小时执行一次
  schedule:
    - cron: '0 */3 * * *'
  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atompages-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet playwright pillow
          python3 -m playwright install --with-deps chromium

      - name: 采集（云端无源目录，用仓库内已有内容做一致性校验）
        run: |
          python3 tools/collect.py --dry-run || true

      - name: 生成缩略图
        run: |
          python3 tools/make_thumbs.py || echo "缩略图生成失败，跳过"

      - name: 提交变更
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "chore: 自动汇集 $(date '+%Y-%m-%d %H:%M')"
            git push
          fi
