<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>分数的第一课 · 结构化讲稿</title>
<style>
  :root{ --bg:#fff; --ink:#1a1a1a; --sub:#5a6b7b; --line:#e5e7eb; --accent:#1d4ed8;
         --concept:#2563eb; --qa:#b45309; --example:#047857; --warn:#b91c1c; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--ink); font:16px/1.8 "PingFang SC","Microsoft YaHei",sans-serif; }
  header{ position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line); padding:14px 28px; z-index:5; }
  h1{ font-size:22px; margin-bottom:10px; }
  .ctrl{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  button,select{ font-size:16px; padding:6px 18px; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:6px; cursor:pointer; }
  select{ background:#fff; color:var(--ink); }
  #time{ color:var(--sub); font-size:16px; }
  #bar{ height:10px; background:var(--line); border-radius:5px; margin-top:12px; cursor:pointer; display:flex; overflow:hidden; }
  .seg{ border-right:2px solid #fff; position:relative; }
  .seg:last-child{ border-right:none; }
  .seg i{ position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--accent); font-style:normal; }
  .seg .lab{ position:absolute; top:12px; left:4px; font-size:16px; color:var(--sub); white-space:nowrap; }
  main{ display:flex; gap:24px; max-width:1280px; margin:0 auto; padding:24px 28px 60px; }
  nav{ flex:.8; min-width:200px; border-right:1px solid var(--line); padding-right:18px; }
  nav h2,aside h2{ font-size:17px; margin-bottom:12px; color:var(--sub); }
  .ch{ margin:10px 0 4px; font-size:17px; font-weight:600; cursor:pointer; padding:6px 10px; border-radius:8px; }
  .sec{ font-size:16px; color:var(--sub); cursor:pointer; padding:5px 10px 5px 26px; border-radius:8px; }
  .ch.now,.sec.now{ background:#eef2ff; color:var(--accent); }
  .ch.past,.sec.past{ color:#9aa5b1; }
  #script{ flex:2.2; }
  .sp{ font-size:18px; margin:12px 0; padding:8px 14px; border-radius:8px; cursor:pointer; }
  .sp.now{ background:#eef2ff; box-shadow:inset 4px 0 0 var(--accent); }
  .sp.past{ color:var(--sub); }
  .cards{ display:flex; flex-direction:column; gap:12px; margin:0 0 4px 34px; }
  .card{ border:1.5px solid var(--line); border-left:6px solid var(--sub); border-radius:10px; padding:12px 16px; cursor:pointer; }
  .card .tag{ display:inline-block; font-size:16px; color:#fff; padding:1px 10px; border-radius:10px; margin-bottom:6px; }
  .card h3{ font-size:17px; margin-bottom:4px; }
  .card .body{ font-size:16px; color:#333; }
  .card.concept{ border-left-color:var(--concept); } .card.concept .tag{ background:var(--concept); }
  .card.qa{ border-left-color:var(--qa); } .card.qa .tag{ background:var(--qa); }
  .card.example{ border-left-color:var(--example); } .card.example .tag{ background:var(--example); }
  .card.warn{ border-left-color:var(--warn); } .card.warn .tag{ background:var(--warn); }
  .card.future{ opacity:.4; }
  .card.live{ border-color:var(--accent); box-shadow:0 2px 14px rgba(29,78,216,.25); }
  aside{ flex:1; border-left:1px solid var(--line); padding-left:20px; }
  .rail-item{ font-size:16px; padding:8px 10px; border-radius:8px; margin:6px 0; cursor:pointer; background:#f6f7f9; }
  .rail-item .t{ color:var(--sub); font-size:16px; margin-right:8px; }
  .rail-item.live{ background:#eef2ff; box-shadow:inset 3px 0 0 var(--accent); }
  .rail-item.past{ opacity:.55; }
  #done{ text-align:center; color:var(--accent); font-size:18px; padding:24px; display:none; }
</style>
</head>
<body>
<header>
  <h1>分数的第一课</h1>
  <div class="ctrl">
    <button id="play">播放</button>
    <span id="time">00:00 / 00:00</span>
    <label>倍速 <select id="speed"><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option></select></label>
  </div>
  <div id="bar"></div>
</header>
<main>
  <nav><h2>大结构 · 章节大纲</h2><div id="outline"></div></nav>
  <section id="script"></section>
  <aside><h2>随讲卡片（叠加层）</h2><div id="rail"></div><div id="done">已讲完，可点击任意段落、章节或卡片回看</div></aside>
</main>
<script>
const TREE = {"title": "分数的第一课", "chapters": [{"title": "分数的第一课", "sections": [{"title": "从分蛋糕说起", "utterances": [{"text": "今天我们先从一个生日会讲起。", "id": "u0", "t": 0.0, "dur": 3.5}, {"text": "妈妈买回来一个大蛋糕，要分给四个小朋友，怎么分才公平呢。", "cards": [{"kind": "warn", "title": "公平的含义", "body": "公平不是随便掰一块，而是每份一样大，这一点后面会反复用到。", "anchor": "u1", "t": 3.5, "dur": 8.45}], "id": "u1", "t": 3.5, "dur": 7.0}, {"text": "对，每人拿四分之一，这四块必须一样大。", "id": "u2", "t": 10.5, "dur": 4.75}, {"text": "这种「每一份都一样多」的分法，在数学里有一个专门的名字，叫做平均分。", "cards": [{"kind": "concept", "title": "平均分", "body": "每一份的数量都相等，才叫平均分。判断是否平均，只看一件事：任何两份交换后没人有意见。", "anchor": "u3", "t": 15.25, "dur": 10.6}], "id": "u3", "t": 15.25, "dur": 8.5}, {"text": "记住这个词，今天整节课都建立在它上面。", "id": "u4", "t": 23.75, "dur": 4.75}], "t": 0.0, "dur": 28.5}, {"title": "半个蛋糕怎么写", "utterances": [{"text": "那半个蛋糕怎么用数字写出来呢。", "id": "u5", "t": 28.5, "dur": 3.75}, {"text": "我们发明一个新符号来表示它，先写一条短横线，下面写 2 表示切成两份，上面写 1 表示拿走其中的一份。", "cards": [{"kind": "concept", "title": "分数三件套", "body": "横线叫分数线，线下叫分母，表示总共切成几份；线上叫分子，表示取了几份。读的时候先读分母，再读分子。", "anchor": "u6", "t": 32.25, "dur": 15.2}], "id": "u6", "t": 32.25, "dur": 12.75}, {"text": "这个数读作二分之一。", "id": "u7", "t": 45.0, "dur": 2.5}], "t": 28.5, "dur": 19.0}], "t": 0.0, "dur": 47.5}, {"title": "分数怎么比大小", "sections": [{"title": "同样的蛋糕，谁拿得多", "utterances": [{"text": "现在有两个小朋友，一个拿了二分之一块蛋糕，一个拿了三分之一块，谁拿得多呢。", "cards": [{"kind": "qa", "title": "先猜一猜", "body": "二分之一和三分之一，哪个大？提示：想象蛋糕被切成的份数越多，每一份就越小。", "anchor": "u8", "t": 47.5, "dur": 11.1}], "id": "u8", "t": 47.5, "dur": 9.25}, {"text": "先别急着算，用刚才的蛋糕想一想。", "id": "u9", "t": 56.75, "dur": 4.0}, {"text": "切成的份数越多，每一份反而越小，所以二分之一比三分之一大。", "cards": [{"kind": "example", "title": "比大小的口诀", "body": "分母相同看分子，分子大的大；分子相同看分母，分母大的反而小。", "anchor": "u10", "t": 60.75, "dur": 8.75}], "id": "u10", "t": 60.75, "dur": 7.25}, {"text": "这个规律反过来也一样，四分之一就比三分之一更小了。", "id": "u11", "t": 68.0, "dur": 6.25}], "t": 47.5, "dur": 26.75}], "t": 47.5, "dur": 26.75}], "total": 74.25, "rate": 4.0};
const TOTAL = TREE.total;
const scriptBox=document.getElementById('script'), railBox=document.getElementById('rail'),
      outline=document.getElementById('outline'), barEl=document.getElementById('bar');
const playBtn=document.getElementById('play'), timeEl=document.getElementById('time'),
      doneEl=document.getElementById('done');
const Kinds={concept:'概念卡',qa:'问答卡',example:'示例卡',warn:'提醒卡'};
const fmt=s=>{s=Math.floor(s);return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;};

/* 进度条 = 大结构：每章一段 */
const segs=[];
TREE.chapters.forEach(ch=>{
  const d=document.createElement('div'); d.className='seg';
  d.style.width=(ch.dur/TOTAL*100)+'%';
  d.innerHTML=`<i></i><span class="lab">${ch.title}</span>`;
  d.onclick=e=>{const r=d.getBoundingClientRect(); seek(ch.t+(e.clientX-r.left)/r.width*ch.dur);};
  barEl.appendChild(d); segs.push({el:d,fill:d.querySelector('i'),ch});
});

/* 大纲 = 大结构视图 */
const navs=[];
TREE.chapters.forEach(ch=>{
  const c=document.createElement('div'); c.className='ch'; c.textContent=ch.title;
  c.onclick=()=>seek(ch.t); outline.appendChild(c); navs.push({el:c,node:ch});
  ch.sections.forEach(sec=>{
    const s=document.createElement('div'); s.className='sec'; s.textContent=sec.title;
    s.onclick=()=>seek(sec.t); outline.appendChild(s); navs.push({el:s,node:sec});
  });
});

/* 讲稿 = 小结构视图；卡片是叠加层，内嵌在锚点分句下方 */
const utts=[], cards=[];
TREE.chapters.forEach(ch=>ch.sections.forEach(sec=>sec.utterances.forEach(u=>{
  const box=document.createElement('div');
  const sp=document.createElement('div'); sp.className='sp'; sp.textContent=u.text;
  sp.onclick=()=>seek(u.t); box.appendChild(sp);
  (u.cards||[]).forEach(cd=>{
    const el=document.createElement('div'); el.className='card '+cd.kind;
    el.innerHTML=`<span class="tag">${Kinds[cd.kind]}</span><h3>${cd.title}</h3><div class="body">${cd.body}</div>`;
    el.onclick=()=>seek(cd.t); box.appendChild(el);
    const ri=document.createElement('div'); ri.className='rail-item';
    ri.innerHTML=`<span class="t">${fmt(cd.t)}</span>${Kinds[cd.kind]} · ${cd.title}`;
    ri.onclick=()=>seek(cd.t); railBox.appendChild(ri);
    cards.push({el,ri,cd});
  });
  scriptBox.appendChild(box);
  utts.push({sp,u});
})));

timeEl.textContent=`00:00 / ${fmt(TOTAL)}`;
let now=0, playing=false, last=null, speed=1;
function seek(t){ now=Math.max(0,Math.min(TOTAL,t)); last=null; render(); }
playBtn.onclick=()=>{ if(now>=TOTAL){now=0;} playing=!playing; playBtn.textContent=playing?'暂停':'播放'; if(playing)doneEl.style.display='none'; };
document.getElementById('speed').onchange=e=>speed=parseFloat(e.target.value);
function render(){
  timeEl.textContent=`${fmt(now)} / ${fmt(TOTAL)}`;
  segs.forEach(({el,fill,ch})=>fill.style.width=Math.max(0,Math.min(100,(now-ch.t)/ch.dur*100))+'%');
  let curSp=null;
  utts.forEach(({sp,u})=>{
    sp.classList.toggle('now',now>=u.t&&now<u.t+u.dur);
    sp.classList.toggle('past',now>=u.t+u.dur);
    if(now>=u.t) curSp=sp;
  });
  navs.forEach(({el,node})=>{
    el.classList.toggle('now',now>=node.t&&now<node.t+node.dur);
    el.classList.toggle('past',now>=node.t+node.dur);
  });
  cards.forEach(({el,ri,cd})=>{
    const live=now>=cd.t&&now<cd.t+cd.dur, passed=now>=cd.t;
    el.classList.toggle('live',live); el.classList.toggle('future',!passed);
    ri.classList.toggle('live',live); ri.classList.toggle('past',passed&&!live);
  });
  const focus=curSp|| (cards.find(c=>now>=c.cd.t&&now<c.cd.t+c.cd.dur)||{}).el;
  if(focus){ const r=focus.getBoundingClientRect();
    if(r.top<90||r.bottom>innerHeight-40) focus.scrollIntoView({behavior:'smooth',block:'center'}); }
  if(now>=TOTAL) doneEl.style.display='block';
}
requestAnimationFrame(function step(ts){
  if(playing){ if(last!=null) now=Math.min(TOTAL,now+(ts-last)/1000*speed); if(now>=TOTAL){playing=false;playBtn.textContent='播放';} }
  last=ts; render(); requestAnimationFrame(step);
});
</script>
</body>
</html>
