<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>自媒体与自我应用的鸿沟</title>
<style>
/* 设计 token 与通用版式 · 自媒体与自我应用的鸿沟 */


:root{
  --paper:#FFFFFF;
  --steel:#26384A;      /* 骨架色 */
  --steel2:#3E566C;
  --ink:#0F1419;
  --ink2:#39424E;
  --muted:#6E7883;
  --line:#D3D9E0;
  --line2:#E7EBEF;
  --fill:#F3F5F7;
  --fill2:#EAEEF2;
  --red:#B23A2E;        /* 标记色：鸿沟 / 黑箱 / 落差 */
  --red-soft:#F7ECE9;
  --red-line:#E0BDB6;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STZhongsong",serif;
  --sans:"Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}

*{ box-sizing:border-box; margin:0; padding:0; }

body{ font-family:var(--sans); color:var(--ink); -webkit-font-smoothing:antialiased; }

.page{
  width:1920px; height:1080px;
  padding:92px 120px 84px;
  display:flex; flex-direction:column;
  background:var(--paper);
  position:relative; overflow:hidden;
}

h1.title{
  font-family:var(--serif); font-weight:900;
  font-size:64px; line-height:1.24; color:var(--steel);
  letter-spacing:.01em;
}
h1.title .hit{ color:var(--red); }

.fig{ flex:1; margin-top:52px; position:relative; display:flex; }
svg.figsvg{ width:100%; height:100%; display:block; }
svg.figsvg text{ font-family:var(--sans); }

.cap{ font-size:24px; line-height:1.7; color:var(--ink2); }
.cap b{ color:var(--ink); font-weight:700; }
.cap .hit{ color:var(--red); font-weight:700; }

/* 结构图常用元件 */
.box{ fill:#fff; stroke:var(--line); stroke-width:2; }
.box-steel{ fill:var(--steel); stroke:none; }
.box-fill{ fill:var(--fill); stroke:var(--line); stroke-width:2; }
.box-red{ fill:var(--red-soft); stroke:var(--red-line); stroke-width:2; }
.box-red-solid{ fill:var(--red); stroke:none; }
.dash{ stroke:var(--steel); stroke-width:2; stroke-dasharray:9 8; fill:none; }
.dash-red{ stroke:var(--red); stroke-width:2.5; stroke-dasharray:11 9; fill:none; }
.ln{ stroke:var(--line); stroke-width:2; fill:none; }
.ln-steel{ stroke:var(--steel); stroke-width:2.5; fill:none; }
.ln-red{ stroke:var(--red); stroke-width:3; fill:none; }
.t-lab{ font-size:24px; fill:var(--ink2); }
.t-lab-b{ font-size:26px; fill:var(--ink); font-weight:700; }
.t-steel{ font-size:26px; fill:var(--steel); font-weight:700; }
.t-red{ font-size:26px; fill:var(--red); font-weight:700; }
.t-head{ font-size:32px; fill:var(--steel); font-weight:700; }
.t-sm{ font-size:20px; fill:var(--muted); }
.t-mono{ font-size:20px; fill:var(--steel); letter-spacing:.06em; }

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#fff}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.slide{position:absolute;width:1920px;height:1080px;transform-origin:center center;display:none;background:#fff;overflow:hidden}
.slide.on{display:block}
#bar{position:fixed;right:26px;bottom:22px;display:flex;gap:14px;align-items:center;
  font-family:var(--sans);font-size:16px;color:#8A939C;user-select:none}
#bar button{font:inherit;border:1px solid #D3D9E0;background:#fff;color:#39424E;padding:6px 14px;cursor:pointer}
@media print{
  html,body{overflow:visible}
  #stage{position:static;display:block}
  .slide{position:relative;display:block!important;page-break-after:always;break-after:page;transform:none!important}
  #bar{display:none}
}
</style>
</head>
<body>

</section>
</section>

<section class="slide" id="s2"><style>#s2 h1.title{ font-size:64px; }
</style>
<section class="page">
  <h1 class="title">同一套方法，<span class="hit">两个结果</span></h1>
  <div class="fig">
    <svg class="figsvg" viewBox="0 0 1680 740" preserveAspectRatio="xMidYMid meet">
      <!-- 左：自媒体给你看到的 -->
      <rect x="0" y="40" width="620" height="620" class="box"/>
      <rect x="0" y="40" width="620" height="66" class="box-fill"/>
      <text x="30" y="84" class="t-steel">自媒体给你看到的</text>

      <rect x="30" y="152" width="14" height="14" fill="#26384A"/>

<section class="slide" id="s3"><style>#s3 h1.title{ font-size:64px; }
</style>
<section class="page">

    <svg class="figsvg" viewBox="0 0 1680 740" preserveAspectRatio="xMidYMid meet">
      <defs>
        <pattern id="hatch" width="16" height="16" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
          <rect width="16" height="16" fill="#F3F5F7"/>
          <line x1="0" y1="0" x2="0" y2="16" stroke="#C9D2DA" stroke-width="3"/>
        </pattern>
      </defs>

      <!-- 左台地：他展示出来的效果 -->
      <rect x="0" y="200" width="700" height="330" fill="url(#hatch)"/>

      <!-- 鸿沟 -->

      <path d="M700,700 L1020,700" class="dash-red"/>

  <div class="fig">

</section>

<section class="slide" id="s5"><style>#s5 h1.title{ font-size:64px; }
</style>
<section class="page">
  <h1 class="title">原因二：方法里还装着<span class="hit">一个黑箱</span></h1>
  <div class="fig">
    <svg class="figsvg" viewBox="0 0 1680 740" preserveAspectRatio="xMidYMid meet">
      <!-- 黑箱本体 -->
      <rect x="280" y="60" width="1030" height="540" fill="#26384A"/>

<div id="bar"><button id="prev">上一页</button><button id="next">下一页</button></div>
<script>
(function(){
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var cur = 0;
  function fit(){
    var s = Math.min(innerWidth/1920, innerHeight/1080);
    slides.forEach(function(el){ el.style.transform = 'scale('+s+')'; });
  }
  function go(i){
    cur = Math.max(0, Math.min(slides.length-1, i));
    slides.forEach(function(el,k){ el.classList.toggle('on', k===cur); });
    try{ localStorage.setItem('gap-deck', String(cur)); }catch(e){}
  }
  document.getElementById('next').addEventListener('click', function(){ go(cur+1); });
  document.getElementById('prev').addEventListener('click', function(){ go(cur-1); });
  document.addEventListener('keydown', function(e){
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); go(cur+1); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); go(cur-1); }
    else if(e.key==='Home'){ go(0); }
    else if(e.key==='End'){ go(slides.length-1); }
    else if(e.key==='p'||e.key==='P'){ window.print(); }
  });
  window.addEventListener('resize', fit);
  fit();
  var saved = 0;
  try{ saved = parseInt(localStorage.getItem('gap-deck'),10) || 0; }catch(e){}
  go(saved);
})();
</script>
