<div id="bar"><button id="prev">上一页</button><button id="next">下一页</button></div>
<script>
(function(){
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var cur = 0;
  function fit(){
    var s = Math.min(innerWidth/1920, innerHeight/1080);
    slides.forEach(function(el){ el.style.transform = 'scale('+s+')'; });
  }
  function go(i){
    cur = Math.max(0, Math.min(slides.length-1, i));
    slides.forEach(function(el,k){ el.classList.toggle('on', k===cur); });
    try{ localStorage.setItem('ethics-deck', String(cur)); }catch(e){}
  }
  document.getElementById('next').addEventListener('click', function(){ go(cur+1); });
  document.getElementById('prev').addEventListener('click', function(){ go(cur-1); });
  document.addEventListener('keydown', function(e){
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); go(cur+1); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); go(cur-1); }
    else if(e.key==='Home'){ go(0); }
    else if(e.key==='End'){ go(slides.length-1); }
    else if(e.key==='p'||e.key==='P'){ window.print(); }
  });
  window.addEventListener('resize', fit);
  fit();
  var saved = 0;
  try{ saved = parseInt(localStorage.getItem('ethics-deck'),10) || 0; }catch(e){}
  go(saved);
})();
</script>
